<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR คณะเภสัชศาสตร์ มช.</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      text-align: center;
      background: #f7f3fa;
    }

    h1 {
      color: #4b286d;
      margin-top: 25px;
    }

    p {
      color: #555;
    }

    model-viewer {
      width: 100%;
      height: 70vh;
      background: transparent;
    }

    button {
      background: #5b3478;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 25px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>🏫 คณะเภสัชศาสตร์ มหาวิทยาลัยเชียงใหม่</h1>
  <p>สแกนเพื่อชมโมเดล 3D</p>

  <model-viewer
    src="pharmacy_cmu_lowpoly_AR_cup_size_upright_FIXED_YUP.glb"
    alt="โมเดล 3D คณะเภสัชศาสตร์ มหาวิทยาลัยเชียงใหม่"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    scale="0.1 0.1 0.1"
    shadow-intensity="1"
    exposure="1">
    
    <button slot="ar-button">
      📱 เปิดโมเดล AR
    </button>

  </model-viewer>

</body>
</html>
