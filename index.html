<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR คณะเภสัชศาสตร์ มช.</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #loading {
      position: fixed;
      top: 20px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 10;
      color: white;
      font-size: 18px;
      text-shadow: 0 1px 4px black;
    }
  </style>
</head>

<body>

  <div id="loading">
    📱 ส่องกล้องไปที่โปสเตอร์คณะเภสัชศาสตร์
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>

      <a-asset-item
        id="pharmacyModel"
        src="./pharmacy_cmu_lowpoly_AR_cup_size_upright_FIXED_YUP.glb">
      </a-asset-item>

    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-gltf-model
        src="#pharmacyModel"
        position="0 0 0.1"
        rotation="0 0 0"
        scale="0.1 0.1 0.1">
      </a-gltf-model>

    </a-entity>

  </a-scene>

</body>
</html>
  </model-viewer>

</body>
</html>
