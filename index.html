<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR คณะเภสัชศาสตร์ มช.</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #text {
      position: fixed;
      top: 15px;
      left: 0;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 18px;
      z-index: 10;
      text-shadow: 0 2px 5px black;
    }
  </style>
</head>

<body>

<div id="text">📱 ส่องโปสเตอร์คณะเภสัชศาสตร์</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  renderer="colorManagement: true">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

  <a-gltf-model
  src="./pharmacy_cmu_lowpoly_AR_cup_size_upright_FIXED_YUP.glb"
  position="0 0 0.1"
  rotation="0 0 0"
  scale="15 15 15">
</a-gltf-model>

  </a-entity>

</a-scene>

</body>
</html>
